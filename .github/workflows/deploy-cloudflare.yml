name: Deploy PolarOps to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync

      - name: Verify Cloudflare configuration
        shell: bash
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still contains the placeholder D1 database_id."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply polarops-db --remote

      - name: Deploy Python Worker
        run: uv run pywrangler deploy
